<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lancer de pièce</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0e0e0e;
      --surface: #1a1a1a;
      --border: #2e2e2e;
      --gold: #d4a853;
      --gold-light: #f0c96a;
      --text: #e8e8e0;
      --muted: #666;
      --accent: #c94040;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'IBM Plex Mono', monospace;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      overflow: hidden;
      position: relative;
    }

    /* Noise texture overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 100;
      opacity: 0.4;
    }

    /* Grid lines background */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 60px 60px;
      opacity: 0.3;
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
      padding: 48px;
    }

    /* Header */
    .header {
      text-align: center;
    }

    .label {
      font-size: 0.65rem;
      letter-spacing: 0.25em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(3.5rem, 8vw, 6rem);
      letter-spacing: 0.06em;
      color: var(--gold);
      line-height: 1;
      text-shadow: 0 0 60px rgba(212, 168, 83, 0.25);
    }

    /* Coin */
    .coin-wrapper {
      perspective: 600px;
    }

    .coin {
      width: 100px;
      height: 100px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.1s;
    }

    .coin.spinning {
      animation: coinSpin 0.08s linear infinite;
    }

    .coin.result-face {
      animation: coinLand 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes coinSpin {
      0%   { transform: rotateY(0deg); }
      100% { transform: rotateY(360deg); }
    }

    @keyframes coinLand {
      0%   { transform: rotateY(0deg) scale(1.1); }
      60%  { transform: rotateY(720deg) scale(1.05); }
      80%  { transform: rotateY(710deg) scale(1); }
      100% { transform: rotateY(720deg) scale(1); }
    }

    .coin-face {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      backface-visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.4rem;
      border: 3px solid var(--gold);
      background: radial-gradient(circle at 35% 35%, #2a2a1e, #111108);
      color: var(--gold);
      box-shadow:
        0 0 0 1px rgba(212,168,83,0.2),
        inset 0 1px 0 rgba(212,168,83,0.3),
        0 8px 32px rgba(0,0,0,0.6);
    }

    .coin-face.back {
      transform: rotateY(180deg);
    }

    /* Stat panel */
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
      width: 360px;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    .stats.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .stat {
      background: var(--surface);
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .stat-label {
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .stat-value {
      font-size: 2rem;
      font-family: 'Bebas Neue', sans-serif;
      color: var(--gold-light);
      letter-spacing: 0.04em;
      line-height: 1;
      transition: all 0.3s ease;
    }

    .stat-value.updating {
      color: var(--gold);
    }

    /* Progress bar */
    .progress-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      width: 360px;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.5s ease 0.1s, transform 0.5s ease 0.1s;
    }

    .progress-wrap.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      padding: 12px 16px 8px;
      font-size: 0.6rem;
      letter-spacing: 0.15em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .progress-bar-bg {
      height: 4px;
      background: var(--border);
      position: relative;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--gold), var(--gold-light));
      width: 0%;
      transition: width 0.8s cubic-bezier(0.22, 1, 0.36, 1);
      position: relative;
    }

    .progress-bar-fill::after {
      content: '';
      position: absolute;
      right: 0;
      top: -2px;
      width: 8px;
      height: 8px;
      background: var(--gold-light);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--gold);
    }

    .progress-label {
      padding: 8px 16px 12px;
      font-size: 0.65rem;
      color: var(--muted);
    }

    /* Button */
    button {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      padding: 16px 40px;
      cursor: pointer;
      border: 1px solid var(--gold);
      background: transparent;
      color: var(--gold);
      position: relative;
      overflow: hidden;
      transition: color 0.3s;
    }

    button::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--gold);
      transform: translateX(-101%);
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: -1;
    }

    button:hover {
      color: var(--bg);
    }

    button:hover::before {
      transform: translateX(0);
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    button:disabled:hover {
      color: var(--gold);
    }

    button:disabled:hover::before {
      transform: translateX(-101%);
    }

    /* Deviation indicator */
    .deviation {
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-align: center;
      opacity: 0;
      transition: opacity 0.5s ease 0.2s;
    }

    .deviation.visible {
      opacity: 1;
    }

    .deviation span {
      color: var(--text);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <p class="label">Simulation probabiliste</p>
      <h1>Lancer de Pièce</h1>
    </div>

    <div class="coin-wrapper">
      <div class="coin" id="coin">
        <div class="coin-face front">P</div>
        <div class="coin-face back">F</div>
      </div>
    </div>

    <button id="btn" onclick="lancer()">Lancer 10 000 fois</button>

    <div class="stats" id="stats">
      <div class="stat">
        <span class="stat-label">Succès</span>
        <span class="stat-value" id="success">—</span>
      </div>
      <div class="stat">
        <span class="stat-label">Échecs</span>
        <span class="stat-value" id="echecs">—</span>
      </div>
    </div>

    <div class="progress-wrap" id="progress-wrap">
      <div class="progress-header">
        <span>Fréquence</span>
        <span id="freq-label">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="bar"></div>
      </div>
      <div class="progress-label" id="frequence"></div>
    </div>

    <p class="deviation" id="deviation"></p>
  </div>

  <script>
    let running = false;

    function lancer() {
      if (running) return;
      running = true;

      const btn = document.getElementById('btn');
      btn.disabled = true;

      // Animate coin
      const coin = document.getElementById('coin');
      coin.classList.remove('result-face');
      coin.classList.add('spinning');

      // Short delay then compute
      setTimeout(() => {
        let success = 0;
        for (let i = 0; i < 10000; i++) {
          if (Math.random() > 0.5) success++;
        }
        const echecs = 10000 - success;
        const frequence = success / 10000;
        const pct = (frequence * 100).toFixed(2);
        const deviation = ((frequence - 0.5) * 100).toFixed(3);
        const deviationSign = deviation >= 0 ? '+' : '';

        // Stop spinning, land
        coin.classList.remove('spinning');
        coin.classList.add('result-face');

        // Show stats
        const stats = document.getElementById('stats');
        const progressWrap = document.getElementById('progress-wrap');
        const deviationEl = document.getElementById('deviation');

        stats.classList.add('visible');
        progressWrap.classList.add('visible');
        deviationEl.classList.add('visible');

        // Update values
        const successEl = document.getElementById('success');
        const echecsEl = document.getElementById('echecs');

        successEl.classList.add('updating');
        echecsEl.classList.add('updating');

        setTimeout(() => {
          successEl.textContent = success.toLocaleString('fr');
          echecsEl.textContent = echecs.toLocaleString('fr');
          successEl.classList.remove('updating');
          echecsEl.classList.remove('updating');

          document.getElementById('bar').style.width = pct + '%';
          document.getElementById('freq-label').textContent = pct + '%';
          document.getElementById('frequence').textContent = `p̂ = ${frequence.toFixed(4)} — sur 10 000 lancers`;
          document.getElementById('deviation').innerHTML = `Écart à 0.5 : <span>${deviationSign}${deviation}%</span>`;

          btn.disabled = false;
          btn.textContent = 'Relancer';
          running = false;
        }, 200);

      }, 900);
    }
  </script>
</body>
</html>
