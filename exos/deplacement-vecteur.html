<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <title>Vecteur - Point en mouvement</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --grid: rgba(255,255,255,0.04);
      --accent: #00ffe0;
      --accent2: #ff4d6d;
      --text: #c8c8d4;
      --panel: rgba(255,255,255,0.04);
    }

    body {
      background: var(--bg);
      font-family: 'Space Mono', monospace;
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      padding: 18px 28px;
      display: flex;
      align-items: baseline;
      gap: 14px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      flex-shrink: 0;
    }

    header h1 {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
    }

    header span {
      font-size: 11px;
      opacity: 0.4;
      letter-spacing: 0.06em;
    }

    .workspace {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    canvas {
      flex: 1;
      display: block;
      cursor: crosshair;
    }

    .panel {
      width: 220px;
      flex-shrink: 0;
      border-left: 1px solid rgba(255,255,255,0.07);
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      background: rgba(0,0,0,0.3);
    }

    .panel-section label {
      display: block;
      font-size: 9px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 10px;
      opacity: 0.8;
    }

    .data-row {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      margin-bottom: 6px;
      color: var(--text);
    }

    .data-row .val {
      color: #fff;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    input[type=range] {
      -webkit-appearance: none;
      width: 100%;
      height: 2px;
      background: rgba(255,255,255,0.12);
      border-radius: 2px;
      outline: none;
      margin-top: 6px;
      margin-bottom: 12px;
      cursor: pointer;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent);
      border: none;
      box-shadow: 0 0 8px var(--accent);
    }

    .slider-row {
      display: flex;
      justify-content: space-between;
      font-size: 9px;
      opacity: 0.4;
      letter-spacing: 0.08em;
      margin-top: -8px;
      margin-bottom: 8px;
    }

    .btn {
      width: 100%;
      padding: 9px;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.15);
      color: var(--text);
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
    }

    .btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(0,255,224,0.06);
    }

    .btn.active {
      border-color: var(--accent2);
      color: var(--accent2);
      background: rgba(255,77,109,0.08);
    }

    footer {
      padding: 10px 28px;
      font-size: 10px;
      opacity: 0.3;
      border-top: 1px solid rgba(255,255,255,0.05);
      letter-spacing: 0.08em;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

<header>
  <h1>Vecteur</h1>
  <span>position + velocity → mouvement</span>
</header>

<div class="workspace">
  <canvas id="canvas"></canvas>

  <div class="panel">
    <div class="panel-section">
      <label>Position</label>
      <div class="data-row"><span>x</span><span class="val" id="px">-</span></div>
      <div class="data-row"><span>y</span><span class="val" id="py">-</span></div>
    </div>

    <div class="panel-section">
      <label>Velocity</label>
      <div class="data-row"><span>vx</span><span class="val" id="vx">-</span></div>
      <div class="data-row"><span>vy</span><span class="val" id="vy">-</span></div>
      <div class="data-row"><span>‖v‖</span><span class="val" id="mag">-</span></div>
    </div>

    <div class="panel-section">
      <label>Vitesse</label>
      <input type="range" id="speed" min="0.5" max="8" step="0.1" value="3">
      <div class="slider-row"><span>lent</span><span>rapide</span></div>
    </div>

    <div class="panel-section">
      <label>Trace</label>
      <input type="range" id="trail" min="0" max="120" step="1" value="60">
      <div class="slider-row"><span>0</span><span>120 pts</span></div>
    </div>

    <div class="panel-section">
      <button class="btn" id="toggleBtn">⏸ Pause</button>
      <br>
      <button class="btn" id="resetBtn" style="margin-top:8px;">↺ Reset</button>
    </div>
  </div>
</div>

<footer>position(t+1) = position(t) + velocity &nbsp;|&nbsp; rebond sur les bords</footer>

<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  // ─── Vecteurs ────────────────────────────────────────────
  const position = { x: 0, y: 0 };
  const velocity = { x: 3, y: 2 };

  let trail = [];
  let running = true;
  let speedFactor = 1;
  let trailLength = 60;
  let animId;

  function resize() {
    canvas.width = canvas.clientWidth;
    canvas.height = canvas.clientHeight;
    // Recentre le point si hors canvas
    position.x = Math.min(Math.max(position.x, 0), canvas.width);
    position.y = Math.min(Math.max(position.y, 0), canvas.height);
  }
  resize();
  window.addEventListener('resize', resize);

  function reset() {
    position.x = canvas.width / 2;
    position.y = canvas.height / 2;
    const angle = Math.random() * Math.PI * 2;
    const spd = parseFloat(document.getElementById('speed').value);
    velocity.x = Math.cos(angle) * spd;
    velocity.y = Math.sin(angle) * spd;
    trail = [];
  }
  reset();

  // ─── Update ──────────────────────────────────────────────
  function update() {
    const spd = parseFloat(document.getElementById('speed').value);
    // Normalise velocity et applique la vitesse du slider
    const mag0 = Math.hypot(velocity.x, velocity.y);
    if (mag0 > 0) {
      velocity.x = (velocity.x / mag0) * spd;
      velocity.y = (velocity.y / mag0) * spd;
    }

    // ← Coeur du concept : position += velocity
    position.x += velocity.x;
    position.y += velocity.y;

    // Rebond sur les bords
    if (position.x <= 4 || position.x >= canvas.width - 4) {
      velocity.x *= -1;
      position.x = Math.min(Math.max(position.x, 4), canvas.width - 4);
    }
    if (position.y <= 4 || position.y >= canvas.height - 4) {
      velocity.y *= -1;
      position.y = Math.min(Math.max(position.y, 4), canvas.height - 4);
    }

    trail.push({ x: position.x, y: position.y });
    const maxTrail = parseInt(document.getElementById('trail').value);
    if (trail.length > maxTrail) trail.shift();
  }

  // ─── Draw ────────────────────────────────────────────────
  function drawGrid() {
    const step = 40;
    ctx.strokeStyle = 'rgba(255,255,255,0.035)';
    ctx.lineWidth = 1;
    for (let x = 0; x < canvas.width; x += step) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
    }
    for (let y = 0; y < canvas.height; y += step) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
    }
  }

  function drawTrail() {
    if (trail.length < 2) return;
    for (let i = 1; i < trail.length; i++) {
      const t = i / trail.length;
      ctx.beginPath();
      ctx.moveTo(trail[i - 1].x, trail[i - 1].y);
      ctx.lineTo(trail[i].x, trail[i].y);
      ctx.strokeStyle = `rgba(0,255,224,${t * 0.5})`;
      ctx.lineWidth = t * 2.5;
      ctx.stroke();
    }
  }

  function drawPoint() {
    const x = position.x, y = position.y;

    // Halo externe
    const glow = ctx.createRadialGradient(x, y, 0, x, y, 30);
    glow.addColorStop(0, 'rgba(0,255,224,0.18)');
    glow.addColorStop(1, 'rgba(0,255,224,0)');
    ctx.beginPath();
    ctx.arc(x, y, 30, 0, Math.PI * 2);
    ctx.fillStyle = glow;
    ctx.fill();

    // Point central
    ctx.beginPath();
    ctx.arc(x, y, 5, 0, Math.PI * 2);
    ctx.fillStyle = '#00ffe0';
    ctx.shadowColor = '#00ffe0';
    ctx.shadowBlur = 20;
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  function drawVelocityArrow() {
    const x = position.x, y = position.y;
    const scale = 8;
    const tx = x + velocity.x * scale;
    const ty = y + velocity.y * scale;

    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(tx, ty);
    ctx.strokeStyle = '#ff4d6d';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Pointe de flèche
    const angle = Math.atan2(ty - y, tx - x);
    ctx.beginPath();
    ctx.moveTo(tx, ty);
    ctx.lineTo(tx - 8 * Math.cos(angle - 0.4), ty - 8 * Math.sin(angle - 0.4));
    ctx.lineTo(tx - 8 * Math.cos(angle + 0.4), ty - 8 * Math.sin(angle + 0.4));
    ctx.closePath();
    ctx.fillStyle = '#ff4d6d';
    ctx.fill();
  }

  function updateHUD() {
    document.getElementById('px').textContent = position.x.toFixed(1);
    document.getElementById('py').textContent = position.y.toFixed(1);
    document.getElementById('vx').textContent = velocity.x.toFixed(2);
    document.getElementById('vy').textContent = velocity.y.toFixed(2);
    document.getElementById('mag').textContent = Math.hypot(velocity.x, velocity.y).toFixed(2);
  }

  // ─── Loop ────────────────────────────────────────────────
  function loop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawGrid();
    if (running) update();
    drawTrail();
    drawVelocityArrow();
    drawPoint();
    updateHUD();
    animId = requestAnimationFrame(loop);
  }
  loop();

  // ─── Contrôles ───────────────────────────────────────────
  document.getElementById('toggleBtn').addEventListener('click', function () {
    running = !running;
    this.textContent = running ? '⏸ Pause' : '▶ Reprendre';
    this.classList.toggle('active', !running);
  });

  document.getElementById('resetBtn').addEventListener('click', reset);

  // Clic sur le canvas → téléporte le point
  canvas.addEventListener('click', function (e) {
    const rect = canvas.getBoundingClientRect();
    position.x = e.clientX - rect.left;
    position.y = e.clientY - rect.top;
    trail = [];
  });
</script>
</body>
</html>
